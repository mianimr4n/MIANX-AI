# MIANX.AI — Production Docker Compose
# Application + PostgreSQL + Redis
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#
# Required in .env.production:
#   POSTGRES_PASSWORD
#   REDIS_PASSWORD
#   DATABASE_URL / DIRECT_URL
#   application secrets

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mianx-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "tries=1", "spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    container_name: mianx-postgres
    restart: unless-stopped
    # Keep PostgreSQL internal to the Docker network; do not expose 5432 publicly.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mianx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mianx_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mianx} -d ${POSTGRES_DB:-mianx_ai}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    container_name: mianx-redis
    restart: unless-stopped
    # Redis is internal-only. Authentication is mandatory.
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.production}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 512m

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
