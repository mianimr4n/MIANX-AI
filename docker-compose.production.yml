# MIANX.AI — Production Docker Compose
# Phase 15: Application + PostgreSQL + optional Redis
#
# Usage:
#   docker compose -f docker-compose.production.yml up -d
#   docker compose -f docker-compose.production.yml logs -f app
#   docker compose -f docker-compose.production.yml down
#
# Prerequisites:
#   - .env.production file exists with required variables
#   - For managed PostgreSQL (recommended): set DATABASE_URL to external host
#     and remove/comment the postgres service below
#   - For local PostgreSQL: ensure POSTGRES_PASSWORD is set in .env.production
#   - Redis is optional (omit redis service and REDIS_URL if not needed)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mianx-ai
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "tries=1", "spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ── PostgreSQL (local/compose) ─────────────────────────
  # For production, consider using a managed service (Supabase, Neon, RDS)
  # and remove this service, setting DATABASE_URL to the managed endpoint.
  postgres:
    image: postgres:16-alpine
    container_name: mianx-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mianx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-mianx_ai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mianx} -d ${POSTGRES_DB:-mianx_ai}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 1g

  # ── Redis (optional — distributed rate limiting) ─────────
  # Remove this service and REDIS_URL env var if not needed.
  redis:
    image: redis:7-alpine
    container_name: mianx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 512m

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
