name: CEO Remediation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply verified P1 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          p = Path('package.json')
          pkg = json.loads(p.read_text())
          pkg['dependencies']['ioredis'] = '^6.0.0'
          p.write_text(json.dumps(pkg, indent=2) + '\n')

          p = Path('prisma/schema.prisma')
          s = p.read_text()
          replacements = {
            'basePrice    Float            @default(0)': 'basePrice    Decimal          @default(0) @db.Decimal(12, 2)',
            'subtotal       Float         @default(0)': 'subtotal       Decimal       @default(0) @db.Decimal(12, 2)',
            'discount       Float         @default(0)': 'discount       Decimal       @default(0) @db.Decimal(12, 2)',
            'tax            Float         @default(0)': 'tax            Decimal       @default(0) @db.Decimal(12, 2)',
            'total          Float         @default(0)': 'total          Decimal       @default(0) @db.Decimal(12, 2)',
            'amount              Float': 'amount              Decimal       @db.Decimal(12, 2)',
          }
          for old, new in replacements.items():
            if old not in s: raise SystemExit(f'Missing schema text: {old}')
            s = s.replace(old, new)
          p.write_text(s)

          p = Path('src/lib/rate-limit.ts')
          s = p.read_text()
          s = s.replace('Requires: bun add ioredis (optional runtime dependency)', 'Requires the ioredis production runtime dependency')
          s = s.replace('If Redis is configured but ioredis is missing or connection fails,\n//     falls back to in-memory and logs a warning (fail-safe, not fail-open)', 'Production requires Redis; there is no silent in-memory fallback.\n//     Local development may use the in-memory store.')
          s = s.replace('// Uses ioredis with dynamic import — no hard dependency.', '// Uses the production ioredis dependency.')
          old = """  } catch (err: unknown) {
    const msg = err instanceof Error ? err.message : String(err)
    console.warn(
      `[rate-limit] REDIS_URL is set but Redis is unavailable: ${msg}. ` +
      'Falling back to in-memory rate limiting. '
      + 'Install ioredis and ensure Redis is reachable for distributed rate limiting.'
    )
    return null
  }
}"""
          new = """  } catch (err: unknown) {
    const msg = err instanceof Error ? err.message : String(err)
    if (process.env.NODE_ENV === 'production') {
      throw new Error(`[rate-limit] Production Redis is unavailable: ${msg}`)
    }
    console.warn(`[rate-limit] Redis unavailable in development: ${msg}`)
    return null
  }
}"""
          if old not in s: raise SystemExit('Missing rate-limit catch block')
          s = s.replace(old, new)
          marker = 'async function getStore(): Promise<RateLimitStore> {'
          verify = """export async function verifyRateLimitInfrastructure(): Promise<void> {
  if (process.env.NODE_ENV !== 'production') return
  if (!process.env.REDIS_URL) throw new Error('[rate-limit] REDIS_URL is required in production')
  const redisStore = await tryCreateRedisStore()
  if (!redisStore) throw new Error('[rate-limit] Redis initialization failed in production')
  store = redisStore
  storeInitAttempted = true
}

"""
          if marker not in s: raise SystemExit('Missing getStore marker')
          s = s.replace(marker, verify + marker, 1)
          s = s.replace("  // Fallback: in-memory (always available)\n  if (!store) {\n    store = new InMemoryRateLimitStore()\n  }\n  return store", "  if (process.env.NODE_ENV === 'production') throw new Error('[rate-limit] Production Redis store is not initialized')\n  if (!store) store = new InMemoryRateLimitStore()\n  return store")
          p.write_text(s)

          p = Path('src/instrumentation.ts')
          s = p.read_text()
          marker = 'export async function register() {\n'
          inject = "  const { verifyRateLimitInfrastructure } = await import('@/lib/rate-limit');\n  await verifyRateLimitInfrastructure();\n\n"
          if inject not in s: s = s.replace(marker, marker + inject, 1)
          p.write_text(s)

          p = Path('src/app/api/stripe/webhook/route.ts')
          s = p.read_text().replace('const amountPaid = Number(invoice.amount_paid || 0) / 100', 'const amountPaid = (Number(invoice.amount_paid || 0) / 100).toFixed(2)')
          p.write_text(s)

          p = Path('src/app/api/billing/checkout/route.ts')
          s = p.read_text()
          needle = """    if (!subscription) {
      const now = new Date()
      subscription = await db.subscription.create({
        data: {
          organizationId: ctx.organizationId,
          planId: plan.id,
          planVersionId: planVersion.id,
          state: 'trialing',
          trialEndsAt: now,
          currentPeriodStart: now,
          currentPeriodEnd: now,
          metadata: JSON.stringify({ checkoutPending: true }),
        },
      })
    }

"""
          if needle not in s: raise SystemExit('Missing checkout subscription block')
          s = s.replace(needle, needle + "    if (subscription.stripeCustomerId !== customerId) {\n      await db.subscription.update({ where: { organizationId: ctx.organizationId }, data: { stripeCustomerId: customerId } })\n    }\n\n", 1)
          p.write_text(s)

          mig = Path('prisma/migrations/20260831000000_financial_decimal/migration.sql')
          mig.parent.mkdir(parents=True, exist_ok=True)
          mig.write_text('''-- Convert monetary Float columns to exact NUMERIC(12,2).\nALTER TABLE "Plan" ALTER COLUMN "basePrice" TYPE DECIMAL(12,2) USING ROUND("basePrice"::numeric, 2);\nALTER TABLE "Invoice" ALTER COLUMN "subtotal" TYPE DECIMAL(12,2) USING ROUND("subtotal"::numeric, 2);\nALTER TABLE "Invoice" ALTER COLUMN "discount" TYPE DECIMAL(12,2) USING ROUND("discount"::numeric, 2);\nALTER TABLE "Invoice" ALTER COLUMN "tax" TYPE DECIMAL(12,2) USING ROUND("tax"::numeric, 2);\nALTER TABLE "Invoice" ALTER COLUMN "total" TYPE DECIMAL(12,2) USING ROUND("total"::numeric, 2);\nALTER TABLE "Payment" ALTER COLUMN "amount" TYPE DECIMAL(12,2) USING ROUND("amount"::numeric, 2);\n''')

          test = Path('src/__tests__/core/financial-precision.test.ts')
          test.write_text("""import { describe, expect, test } from 'bun:test'
import { Prisma } from '@prisma/client'

describe('financial precision', () => {
  test('Decimal avoids binary floating-point drift', () => {
    const total = new Prisma.Decimal('0.1').plus(new Prisma.Decimal('0.2'))
    expect(total.toFixed(2)).toBe('0.30')
  })

  test('Stripe cents become exact two-decimal money', () => {
    expect((12345 / 100).toFixed(2)).toBe('123.45')
  })
})
""")
          PY
          bun install --lockfile-only
          bun run db:validate
          bun run db:generate
          bun run typecheck
          bun test
          bun run build
          rm -f .github/workflows/ceo-remediate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json bun.lock prisma/schema.prisma prisma/migrations/20260831000000_financial_decimal/migration.sql src/lib/rate-limit.ts src/instrumentation.ts src/app/api/stripe/webhook/route.ts src/app/api/billing/checkout/route.ts src/__tests__/core/financial-precision.test.ts .github/workflows/ceo-remediate.yml
          git commit -m 'fix: complete financial precision and production Redis hardening'
          git push origin main
