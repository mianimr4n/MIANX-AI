# MIANX.AI — CI Pipeline
# Phase 12 → 15: Install → Generate → Lint → TypeCheck → Tests → Build
#
# Phase 15: Prisma schema now targets PostgreSQL (production).
# prisma generate does NOT need a live database.
# The build step uses a dummy DATABASE_URL with postgresql:// prefix
# so Prisma client types match production.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      # Dummy PostgreSQL URL — prisma generate never connects to it.
      # This ensures generated client types match production PostgreSQL.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_db"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bun run db:validate

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: TypeCheck (production)
        run: NODE_ENV=production npx tsc --noEmit

      - name: Core Unit Tests
        run: bun test

      - name: Tenant Isolation Tests
        run: bun run scripts/test-tenant-isolation.ts

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
