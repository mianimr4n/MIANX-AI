# MIANX.AI — CI Pipeline
# Install → Generate → Lint → TypeCheck → Tests → Build → Production Compose Validation

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci_db"
      DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci_db"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Prisma schema
        run: bun run db:validate

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: TypeCheck (production)
        run: NODE_ENV=production npx tsc --noEmit

      - name: Core Unit Tests
        run: bun test

      - name: Tenant Isolation Tests
        run: bun run scripts/test-tenant-isolation.ts

      - name: Validate production Docker Compose
        env:
          REDIS_PASSWORD: ci-redis-password
          POSTGRES_PASSWORD: ci-postgres-password
        run: docker compose -f docker-compose.production.yml config --quiet

      - name: Build (standalone)
        run: bun run build:standalone
        env:
          NODE_ENV: production
