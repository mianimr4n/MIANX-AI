# MIANX.AI — CI Pipeline
# Phase 11: Install → Generate → Lint → TypeCheck → Tests → Build

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Lint
        run: bun run lint

      - name: TypeCheck (production)
        run: NODE_ENV=production npx tsc --noEmit

      - name: Tenant Isolation Tests
        run: bun run scripts/test-tenant-isolation.ts

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          DATABASE_URL: "file:./db/custom.db"
