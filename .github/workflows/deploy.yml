# MIANX.AI — Production Deployment Workflow
# CI → production environment approval → migrate → deploy → live health verification

name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL || 'https://app.mianx.ai' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/mianx-ai
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.production.yml build
            docker compose -f docker-compose.production.yml run --rm app bun run db:migrate:deploy
            docker compose -f docker-compose.production.yml up -d
            echo "Waiting for startup (30s)..."
            sleep 30
            curl -fsS http://localhost:3000/api/health >/dev/null

      - name: Live Health Verification
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL || 'https://app.mianx.ai' }}
        run: |
          set -e
          curl -fsS "$DEPLOY_URL/api/health"

      - name: Notify Rollback on Failure
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED"
          echo "Manual rollback required. See docs/deployment/05-rollback-runbook.md"
